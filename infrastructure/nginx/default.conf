server {
    listen 80;

    # Docker service IPs can change whenever a container is recreated.
    # Resolve service names through Docker DNS on each upstream connection
    # instead of pinning the IP that existed when Nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $backend_upstream backend:9000;
    set $frontend_upstream frontend:5173;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /sanctum/csrf-cookie {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $backend_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        internal;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
