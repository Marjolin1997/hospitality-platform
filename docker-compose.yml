services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./backend:/var/www/backend
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [hospitality]
  backend:
    build: ./backend
    working_dir: /var/www/html
    volumes: ["./backend:/var/www/html"]
    env_file: ./backend/.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [hospitality]
  queue:
    build: ./backend
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes: ["./backend:/var/www/html"]
    env_file: ./backend/.env
    depends_on: [backend, redis]
    networks: [hospitality]
  frontend:
    build: ./frontend
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    networks: [hospitality]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hospitality
      MYSQL_USER: hospitality
      MYSQL_PASSWORD: hospitality
      MYSQL_ROOT_PASSWORD: root
    ports: ["3310:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
    networks: [hospitality]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    networks: [hospitality]
volumes:
  mysql_data:
  redis_data:
networks:
  hospitality:
    driver: bridge
